<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山火事件指挥与离线人员调度</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}</style></head><body><h1>山火事件指挥与离线人员调度</h1><p>维护火线、风向、资源和任务区，合并离线现场记录并防止人员重复分配</p><p>火线长度、风向变化和离线记录数量影响风险等级；同一资源不能同时出现在多个活动任务中。</p><button onclick="loadItems()">刷新列表</button> <button onclick="loadDevices()">设备台账</button> <button onclick="loadReviews()">待核对批次</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function get(url,role){const r=await fetch(url,{headers:{'X-Actor':'demo','X-Role':role||'viewer'}});return await r.json()}async function loadItems(){document.getElementById('out').textContent=JSON.stringify(await get('/api/items'),null,2)}async function loadDevices(){document.getElementById('out').textContent=JSON.stringify(await get('/api/devices'),null,2)}async function loadReviews(){document.getElementById('out').textContent=JSON.stringify(await get('/api/reviews'),null,2)}</script></body></html>
